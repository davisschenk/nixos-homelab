name: Validate infrastructure

on:
  pull_request:
    paths:
      - ".github/**"
      - ".sops.yaml"
      - "flake.nix"
      - "flake.lock"
      - "hosts/**"
      - "infra/**"
      - "modules/**"
      - "tests/**"
      - "justfile"
      - "statix.toml"
      - "secrets/estuary.yaml"
      - "secrets/wireguard.yaml"

permissions:
  contents: read

jobs:
  ingress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 infra/scripts/validate_ingress.py

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.14.5"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  terraform-plan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    environment: planning
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PLAN_API_TOKEN }}
      OVH_APPLICATION_KEY: ${{ secrets.OVH_PLAN_APPLICATION_KEY }}
      OVH_APPLICATION_SECRET: ${{ secrets.OVH_PLAN_APPLICATION_SECRET }}
      OVH_CONSUMER_KEY: ${{ secrets.OVH_PLAN_CONSUMER_KEY }}
      OVH_ENDPOINT: ovh-us
      TF_TOKEN_app_terraform_io: ${{ secrets.TFE_PLAN_TOKEN }}
      TF_VAR_bootstrap_complete: ${{ vars.TF_BOOTSTRAP_COMPLETE || 'false' }}
      TF_VAR_bootstrap_ssh_cidr: ${{ vars.TF_BOOTSTRAP_SSH_CIDR }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.14.5"
      - run: terraform init
      - run: terraform plan -input=false -lock=false -no-color

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enable KVM for the NixOS integration test
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Install just
        run: nix profile add nixpkgs#just
      - run: just fmt-check
      - run: just lint
      - run: nix flake check --print-build-logs
      - run: nix build .#nixosConfigurations.mangrove.config.system.build.toplevel --no-link
      - run: nix build .#nixosConfigurations.estuary.config.system.build.toplevel --no-link
