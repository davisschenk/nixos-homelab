version: 1
metadata:
  name: "Mangrove - Infrarust"
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_proxy.proxyprovider
    state: present
    identifiers:
      name: "Infrarust Provider"
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      external_host: "https://infrarust.schenkenberger.dev"
      mode: forward_single
      cookie_domain: "schenkenberger.dev"
  - model: authentik_core.application
    state: present
    identifiers:
      slug: "infrarust"
    attrs:
      name: "Infrarust"
      slug: "infrarust"
      icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/minecraft.png"
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, Infrarust Provider]]
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !Find [authentik_core.application, [slug, infrarust]]
      group: !Find [authentik_core.group, [name, super-admin]]
      order: 0
    attrs:
      enabled: true
